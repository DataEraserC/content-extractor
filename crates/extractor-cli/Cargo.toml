[package]
name = "extractor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "cx: content extraction and per-platform login from a shell, no harness"

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]
# The CLI is a second host of the same effects: state root resolution, the
# clock, the filesystem and the browser launcher all live in `extractor-abi`, and
# re-implementing them here would defeat the split the kernel is built around.
extractor-abi = { path = "../extractor-abi" }
extractor-core = { workspace = true }
serde_json = { workspace = true }
